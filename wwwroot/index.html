<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animes</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app" class="loading-container">
        <div class="loading-spinner">
            <svg viewBox="0 0 100 100">
                <circle class="spinner-bg" cx="50" cy="50" r="40" fill="none" />
                <circle class="spinner-active" cx="50" cy="50" r="40" fill="none" />
            </svg>
        </div>
        <div class="loading-text">Carregando<span class="dots"></span></div>
    </div>

    <style>
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020509;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            z-index: 9999;
        }

        .loading-spinner {
            width: 64px;
            height: 64px;
        }

        @media (min-width: 768px) {
            .loading-spinner {
                width: 80px;
                height: 80px;
            }
        }

        .loading-spinner svg {
            width: 100%;
            height: 100%;
            animation: rotate 1.4s linear infinite;
        }

        .spinner-bg {
            stroke: rgba(59, 130, 246, 0.1);
            stroke-width: 4;
        }

        .spinner-active {
            stroke: #3B82F6;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 251.2;
            stroke-dashoffset: 188.4;
            animation: dash 1.4s ease-in-out infinite;
            filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.5));
        }

        @keyframes rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes dash {
            0% {
                stroke-dashoffset: 251.2;
            }

            50% {
                stroke-dashoffset: 62.8;
            }

            100% {
                stroke-dashoffset: 251.2;
            }
        }

        .loading-text {
            font-family: 'Bebas Neue', system-ui, -apple-system, sans-serif;
            font-size: 0.875rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .dots {
            display: inline-flex;
            width: 2rem;
        }

        .dots::after {
            content: '';
            display: inline-block;
            width: 0;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-spinner svg {
                animation: none;
            }

            .spinner-active {
                animation: none;
                stroke-dashoffset: 62.8;
            }

            .dots::after {
                animation: none;
                content: '...';
            }
        }
    </style>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
